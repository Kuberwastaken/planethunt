<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d"><title id="t">Search coverage</title><desc id="d">Number of stars in each search, on a shared scale.</desc><rect width="640" height="250" fill="#080808" rx="0"/><text x="20.0" y="24.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Kepler Bonus: pilot + extension (matched null control)</text><rect x="20.0" y="32.0" width="548.2" height="16.0" fill="#ffffff" rx="2" opacity="1"/><text x="574.2" y="45.0" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">1,736</text><text x="20.0" y="76.5" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">TESS extension, assigned targets</text><rect x="20.0" y="84.5" width="170.5" height="16.0" fill="#aaaaaa" rx="2" opacity="1"/><text x="196.5" y="97.5" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">540</text><text x="20.0" y="129.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Upstream TESS results inherited (not redone)</text><rect x="20.0" y="137.0" width="166.1" height="16.0" fill="#888888" rx="2" opacity="1"/><text x="192.1" y="150.0" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">526</text><text x="20.0" y="181.5" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Codex TESS pilot</text><rect x="20.0" y="189.5" width="55.3" height="16.0" fill="#dddddd" rx="2" opacity="1"/><text x="81.3" y="202.5" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">175</text><text x="20.0" y="244.0" font-size="11" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Stars per search. Not a success-rate chart; counts of different kinds are not added together.</text></svg>