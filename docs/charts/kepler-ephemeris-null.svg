<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Depth at candidate and Kepler-169 ephemerides</title><desc id="d">The target shows a 2,350 ppm dip at the candidate ephemeris and no depth at any of the five Kepler-169 planet ephemerides or in the neighbour light curve.</desc><rect width="640" height="360" fill="#080808" rx="0"/><line x1="111.0" y1="16.0" x2="111.0" y2="320.0" stroke="#aaaaaa" stroke-width="1"/><text x="111.0" y="338.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">0</text><line x1="301.0" y1="16.0" x2="301.0" y2="320.0" stroke="#303030" stroke-width="1"/><text x="301.0" y="338.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">1,000</text><line x1="491.0" y1="16.0" x2="491.0" y2="320.0" stroke="#303030" stroke-width="1"/><text x="491.0" y="338.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">2,000</text><text x="328.0" y="354.0" font-size="12" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">Box depth in the target PSF light curve (ppm); neighbour row is its own light curve</text><text x="16.0" y="31.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Candidate ephemeris (13.769 d)  (n=73)</text><line x1="532.9" y1="45.7" x2="581.4" y2="45.7" stroke="#ffffff" stroke-width="2"/><circle cx="557.1" cy="45.7" r="5" fill="#ffffff" stroke="none" stroke-width="1" opacity="1"/><text x="524.9" y="50.7" font-size="12" fill="#aaaaaa" text-anchor="end" font-weight="400" font-family="IBM Plex Mono,monospace">2,348 ± 128</text><text x="16.0" y="75.1" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Kepler-169 e (13.767 d)  (n=74)</text><line x1="105.8" y1="89.1" x2="145.9"