<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t d"><title id="t">Scenario probabilities</title><desc id="d">For the Kepler candidate most probability is a planet on target; the remaining mass is mostly a planet around an unseen bound companion. For the TESS lead the largest block is an eclipsing binary.</desc><rect width="640" height="330" fill="#181a19" rx="10"/><text x="20.0" y="24.0" font-size="14" fill="#eeeae2" text-anchor="start" font-weight="600" font-family="Helvetica Neue,Helvetica,sans-serif">KIC 5689121 (Kepler)</text><rect x="20.0" y="32.0" width="450.1" height="26.0" fill="#9fc5ac" rx="0" opacity="1"/><text x="245.0" y="50.0" font-size="13" fill="#10172a" text-anchor="middle" font-weight="700" font-family="Helvetica Neue,Helvetica,sans-serif">75%</text><rect x="470.1" y="32.0" width="40.8" height="26.0" fill="#d7c18d" rx="0" opacity="1"/><text x="490.5" y="50.0" font-size="13" fill="#10172a" text-anchor="middle" font-weight="700" font-family="Helvetica Neue,Helvetica,sans-serif">7%</text><rect x="510.9" y="32.0" width="109.0" height="26.0" fill="#b4c6b2" rx="0" opacity="1"/><text x="565.4" y="50.0" font-size="13" fill="#10172a" text-anchor="middle" font-weight="700" font-family="Helvetica Neue,Helvetica,sans-serif">18%</text><rect x="619.9" y="32.0" width="0.0" height="26.0" fill="#db998b" rx="0" opacity="1"/><rect x="619.9" y="32.0" width="0.1" height="26.0" fill="#a070c8" rx="0" opacity="1"/><text x="20.0" y="86.0" font-size="14" fill="#eeeae2" text-anchor="start" font-weight="600" font-family="Helvetica Neue,Helvetica,sans-serif">TIC 309780779 (TESS)</text><rect x="20.0" y="94.0" width="209.7" height="26.0" fill="#9fc5ac" rx="0" opacity="1"/><text x="124.8" y="112.0" font-size="13" fill="#10172a" text-anchor="middle" font-weight="700" font-family="Helvetica Neue,Helvetica,sans-serif">35%</text><rect x="229.7" y="94.0" width="40.2" height="26.0" fill="#d7c18d" rx="0" opacity="1"/><text x="249.7" y="112.0" font-size="13" fill="#10172a" text-anchor="middle" font-weight="700" font-family="Helvetica Neue,Helvetica,sans-serif">7%</text><rect x="269.8" y="94.0" width="49.9" height="26.0" fill="#b4c6b2" rx="0" opacity="1"/><text x="294.8" y="112.0" font-size="13" fill="#10172a" text-anchor="middle" font-weight="700" font-family="Helvetica Neue,Helvetica,sans-serif">8%</text><rect x="319.7" y="94.0" width="282.1" height="26.0" fill="#db998b" rx="0" opacity="1"/><text x="460.8" y="112.0" font-size="13" fill="#10172a" text-anchor="middle" font-weight="700" font-family="Helvetica Neue,Helvetica,sans-serif">47%</text><rect x="601.8" y="94.0" width="18.2" height="26.0" fill="#a070c8" rx="0" opacity="1"/><rect x="20.0" y="159.0" width="13.0" height="13.0" fill="#9fc5ac" rx="2" opacity="1"/><text x="42.0" y="170.0" font-size="13" fill="#a8aea5" text-anchor="start" font-weight="400" font-family="Helvetica Neue,Helvetica,sans-serif">Planet on target</text><rect x="20.0" y="183.0" width="13.0" height="13.0" fill="#d7c18d" rx="2" opacity="1"/><text x="42.0" y="194.0" font-size="13" fill="#a8aea5" text-anchor="start" font-weight="400" font-family="Helvetica Neue,Helvetica,sans-serif">Planet on a bound companion (STP)</text><rect x="20.0" y="207.0" width="13.0" height="13.0" fill="#b4c6b2" rx="2" opacity="1"/><text x="42.0" y="218.0" font-size="13" fill="#a8aea5" text-anchor="start" font-weight="400" font-family="Helvetica Neue,Helvetica,sans-serif">Planet on unrelated nearby star (PTP/DTP/BTP)</text><rect x="20.0" y="231.0" width="13.0" height="13.0" fill="#db998b" rx="2" opacity="1"/><text x="42.0" y="242.0" font-size="13" fill="#a8aea5" text-anchor="start" font-weight="400" font-family="Helvetica Neue,Helvetica,sans-serif">Eclipsing binary bound to target (SEB)</text><rect x="20.0" y="255.0" width="13.0" height="13.0" fill="#a070c8" rx="2" opacity="1"/><text x="42.0" y="266.0" font-size="13" fill="#a8aea5" text-anchor="start" font-weight="400" font-family="Helvetica Neue,Helvetica,sans-serif">Other binary scenarios</text><text x="20.0" y="308.0" font-size="12" fill="#a8aea5" text-anchor="start" font-weight="400" font-family="Helvetica Neue,Helvetica,sans-serif">Share of total scenario probability (mean of runs).</text><text x="20.0" y="324.0" font-size="12" fill="#a8aea5" text-anchor="start" font-weight="400" font-family="Helvetica Neue,Helvetica,sans-serif">False-positive probability = everything except the green block.</text></svg>