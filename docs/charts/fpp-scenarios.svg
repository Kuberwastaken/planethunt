<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t d"><title id="t">Scenario probabilities</title><desc id="d">For the Kepler candidate most probability is a planet on target; the remaining mass is mostly a planet around an unseen bound companion. For the TESS lead the largest block is an eclipsing binary.</desc><rect width="640" height="330" fill="#080808" rx="0"/><text x="20.0" y="24.0" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600" font-family="IBM Plex Mono,monospace">KIC 5689121 (Kepler)</text><rect x="20.0" y="32.0" width="558.7" height="26.0" fill="#dddddd" rx="0" opacity="1"/><text x="299.3" y="50.0" font-size="13" fill="#080808" text-anchor="middle" font-weight="700" font-family="IBM Plex Mono,monospace">93%</text><rect x="578.7" y="32.0" width="40.8" height="26.0" fill="#ffffff" rx="0" opacity="1"/><text x="599.1" y="50.0" font-size="13" fill="#080808" text-anchor="middle" font-weight="700" font-family="IBM Plex Mono,monospace">7%</text><rect x="619.5" y="32.0" width="0.4" height="26.0" fill="#aaaaaa" rx="0" opacity="1"/><rect x="619.9" y="32.0" width="0.0" height="26.0" fill="#888888" rx="0" opacity="1"/><rect x="619.9" y="32.0" width="0.1" height="26.0" fill="#555555" rx="0" opacity="1"/><text x="20.0" y="86.0" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600" font-family="IBM Plex Mono,monospace">TIC 309780779 (TESS)</text><rect x="20.0" y="94.0" width="259.4" height="26.0" fill="#dddddd" rx="0" opacity="1"/><text x="149.7" y="112.0" font-size="13" fill="#080808" text-anchor="middle" font-weight="700" font-family="IBM Plex Mono,monospace">43%</text><rect x="279.4" y="94.0" width="40.2" height="26.0" fill="#ffffff" rx="0" opacity="1"/><text x="299.5" y="112.0" font-size="13" fill="#080808" text-anchor="middle" font-weight="700" font-family="IBM Plex Mono,monospace">7%</text><rect x="319.6" y="94.0" width="0.1" height="26.0" fill="#aaaaaa" rx="0" opacity="1"/><rect x="319.7" y="94.0" width="282.1" height="26.0" fill="#888888" rx="0" opacity="1"/><text x="460.8" y="112.0" font-size="13" fill="#080808" text-anchor="middle" font-weight="700" font-family="IBM Plex Mono,monospace">47%</text><rect x="601.8" y="94.0" width="18.2" height="26.0" fill="#555555" rx="0" opacity="1"/><rect x="20.0" y="159.0" width="13.0" height="13.0" fill="#dddddd" rx="2" opacity="1"/><text x="42.0" y="170.0" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Planet on target (TP / PTP / DTP)</text><rect x="20.0" y="183.0" width="13.0" height="13.0" fill="#ffffff" rx="2" opacity="1"/><text x="42.0" y="194.0" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Planet on a bound companion (STP)</text><rect x="20.0" y="207.0" width="13.0" height="13.0" fill="#aaaaaa" rx="2" opacity="1"/><text x="42.0" y="218.0" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Planet on background star (BTP)</text><rect x="20.0" y="231.0" width="13.0" height="13.0" fill="#888888" rx="2" opacity="1"/><text x="42.0" y="242.0" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Eclipsing binary bound to target (SEB)</text><rect x="20.0" y="255.0" width="13.0" height="13.0" fill="#555555" rx="2" opacity="1"/><text x="42.0" y="266.0" font-size="13" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Other binary scenarios</text><text x="20.0" y="308.0" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Share of total scenario probability (mean of runs).</text><text x="20.0" y="324.0" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">FPP excludes the planet-on-target scenarios (TP, PTP and DTP).</text></svg>