<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d"><title id="t">Blind period search, real versus inverted</title><desc id="d">The real TESS light curve gives a strong 8.72 day peak in the full data and in each half; the inverted light curve gives weaker peaks.</desc><rect width="640" height="280" fill="#080808" rx="0"/><line x1="20.0" y1="16.0" x2="20.0" y2="240.0" stroke="#303030" stroke-width="1"/><text x="20.0" y="258.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">0</text><line x1="156.4" y1="16.0" x2="156.4" y2="240.0" stroke="#303030" stroke-width="1"/><text x="156.4" y="258.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">5</text><line x1="292.7" y1="16.0" x2="292.7" y2="240.0" stroke="#303030" stroke-width="1"/><text x="292.7" y="258.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">10</text><line x1="429.1" y1="16.0" x2="429.1" y2="240.0" stroke="#303030" stroke-width="1"/><text x="429.1" y="258.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">15</text><line x1="565.5" y1="16.0" x2="565.5" y2="240.0" stroke="#303030" stroke-width="1"/><text x="565.5" y="258.0" font-size="13" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">20</text><text x="330.0" y="274.0" font-size="12" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-family="IBM Plex Mono,monospace">Peak strength (SDE): 8.7236 d signal versus inverted-data peak</text><text x="20.0" y="32.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Full data</text><rect x="20.0" y="38.0" width="534.5" height="14.0" fill="#ffffff" rx="2" opacity="1"/><text x="560.5" y="50.0" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">19.6 real</text><rect x="20.0" y="56.0" width="212.7" height="14.0" fill="#666666" rx="2" opacity="1"/><text x="238.7" y="68.0" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">7.8 inverted</text><text x="20.0" y="106.7" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Sectors 1-38 only</text><rect x="20.0" y="112.7" width="343.6" height="14.0" fill="#ffffff" rx="2" opacity="1"/><text x="369.6" y="124.7" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">12.6 real</text><rect x="20.0" y="130.7" width="163.6" height="14.0" fill="#666666" rx="2" opacity="1"/><text x="189.6" y="142.7" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">6.0 inverted</text><text x="20.0" y="181.3" font-size="13" fill="#ffffff" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">Sectors 61-90 only</text><rect x="20.0" y="187.3" width="351.8" height="14.0" fill="#ffffff" rx="2" opacity="1"/><text x="377.8" y="199.3" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">12.9 real</text><text x="20.0" y="217.3" font-size="12" fill="#aaaaaa" text-anchor="start" font-weight="400" font-family="IBM Plex Mono,monospace">inverted peak not saved for this half</text><rect class="chart-hit" x="20.00" y="22.00" width="600.00" height="74.67" fill="transparent" data-chart-detail="[&quot;Full data&quot;, [[&quot;Real SDE&quot;, &quot;19.6&quot;], [&quot;Inverted SDE&quot;, &quot;7.8&quot;]]]"><title>Full data</title></rect><rect class="chart-hit" x="20.00" y="96.67" width="600.00" height="74.67" fill="transparent" data-chart-detail="[&quot;Sectors 1-38 only&quot;, [[&quot;Real SDE&quot;, &quot;12.6&quot;], [&quot;Inverted SDE&quot;, &quot;6.0&quot;]]]"><title>Sectors 1-38 only</title></rect><rect class="chart-hit" x="20.00" y="171.33" width="600.00" height="74.67" fill="transparent" data-chart-detail="[&quot;Sectors 61-90 only&quot;, [[&quot;Real SDE&quot;, &quot;12.9&quot;], [&quot;Inverted SDE&quot;, &quot;Not saved&quot;]]]"><title>Sectors 61-90 only</title></rect></svg>